[package]
name = "mock-attestations"
version = "0.1.0"
description = "Test fixture only — mints VERIFIED_HUMAN-shaped PDAs for vote-gate's local integration test"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/poh-kit/poh-kit"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_attestations"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
